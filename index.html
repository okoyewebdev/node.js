<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, beginner-friendly app for creating and viewing notes."
    />
    <title>Little Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Little Notes home">
          <span class="brand-mark">L</span>
          <span>Little Notes</span>
        </a>
        <button class="new-note-button" id="new-note-button" type="button">
          <span aria-hidden="true">+</span> New Note
        </button>
      </header>

      <section class="welcome" aria-labelledby="page-title">
        <p class="eyebrow">YOUR PERSONAL NOTEBOOK</p>
        <h1 id="page-title">Small thoughts,<br />kept beautifully.</h1>
        <p class="intro">Keep ideas, reminders, and bright sparks in one calm place.</p>
      </section>

      <section class="note-form-section" id="note-form-section" hidden aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CREATE A NOTE</p>
            <h2 id="form-title">What is on your mind?</h2>
          </div>
          <button class="close-button" id="close-form-button" type="button" aria-label="Close note form">&times;</button>
        </div>

        <form id="note-form">
          <div class="form-row">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" placeholder="Give your note a title" required maxlength="80" />
          </div>

          <div class="form-row">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Ideas">Ideas</option>
              <option value="To Do">To Do</option>
            </select>
          </div>

          <div class="form-row">
            <label for="content">Your note</label>
            <textarea id="content" name="content" placeholder="Write something worth remembering..." required maxlength="1000"></textarea>
          </div>

          <div class="form-actions">
            <button class="cancel-button" id="cancel-button" type="button">Cancel</button>
            <button class="save-button" type="submit">Save Note</button>
          </div>
        </form>
      </section>

      <section class="notes-section" aria-labelledby="notes-title">
        <div class="section-heading notes-heading">
          <div>
            <p class="eyebrow">YOUR COLLECTION</p>
            <h2 id="notes-title">Saved notes <span id="note-count">0</span></h2>
          </div>
        </div>
        <div class="notes-grid" id="notes-grid"></div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">✦</div>
          <h3>Your notebook is ready</h3>
          <p>Start by adding a thought, an idea, or a handy reminder.</p>
          <button class="text-button" id="empty-new-note-button" type="button">Create your first note</button>
        </div>
      </section>
    </main>

    <template id="note-template">
      <article class="note-card">
        <div class="note-card-top">
          <span class="category-label"></span>
          <button class="delete-button" type="button" aria-label="Delete note">&times;</button>
        </div>
        <h3 class="note-title"></h3>
        <p class="note-content"></p>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
